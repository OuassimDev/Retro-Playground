<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake - Playground</title>
    <link rel="icon" type="image/x-icon" href="/Working On it/Retro/assets/images/RP.png">
    <link rel="stylesheet" href="Snake.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <a href="../../index.html#Games" id="hometitle" class="home-btn"></a>

    <div class="game-container">

        <div class="score-board">
            <div>SCORE: <span id="score">0</span></div>
            <div>HIGH: <span id="highScore">0</span></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls">
            <button id="startBtn" onclick="startGame()">START</button>
            <button id="resetBtn" onclick="resetGame()">RESET</button>
        </div>

        <div class="mobile-controls" id="mobileControls">
            <button class="arrow-btn" id="upBtn" onclick="changeDirection(0, -1)">↑</button>
            <button class="arrow-btn" id="leftBtn" onclick="changeDirection(-1, 0)">←</button>
            <button class="arrow-btn" id="rightBtn" onclick="changeDirection(1, 0)">→</button>
            <button class="arrow-btn" id="downBtn" onclick="changeDirection(0, 1)">↓</button>
        </div>

    </div>

    

    
    

    <script src="Snake.js"></script>
</body>
</html>
